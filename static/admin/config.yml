# Netlify: enable Identity + Git Gateway (branch must match `backend.branch` below).
# Local: run `npm run cms` (decap-server) in a second terminal, then open /admin on localhost.

local_backend: true

backend:
    name: git-gateway
    branch: main

media_folder: ../uploads
public_folder: /uploads

collections:
    - name: education_mode
      label: Ausbildungsmodi
      folder: content/education_modes
      label_singular: Ausbildungsmodus
      create: true
      extension: json
      format: json
      slug: "{{slug}}"
      sortable_fields: ["title"]
      fields:
          - { label: Titel, name: title, widget: string }
          - {
                label: Übersicht,
                name: overview,
                widget: markdown,
                required: false,
            }
          - {
                label: Umsetzungsbeispiele (PDF),
                name: implementation_examples_pdf,
                widget: file,
                required: false,
            }
          - label: Lehrjahre
            name: years
            label_singular: Lehrjahr
            widget: list
            min: 0
            summary: "Lehrjahr {{fields.year}}"
            fields:
                - { label: Jahr, name: year, widget: number }
                - label: Themenbereiche
                  name: themenbereiche
                  label_singular: Themenbereich
                  widget: list
                  min: 0
                  summary: "{{fields.number}}. {{fields.title}}"
                  fields:
                      - { label: Nummer, name: number, widget: number }
                      - { label: Titel, name: title, widget: string }
                      - {
                            label: Lektionen,
                            name: lessons,
                            widget: number,
                            required: false,
                        }
                      - {
                            label: Beschreibung,
                            name: description,
                            widget: markdown,
                        }
                      - {
                            label: Detaillierte Erweiterung,
                            name: additional_description,
                            widget: markdown,
                            required: false,
                        }
                      - {
                            label: Kerninhalte,
                            name: kerninhalte,
                            widget: text,
                            required: false,
                        }
                      - label: Schlüsselkompetenzen
                        name: essential_competences
                        widget: relation
                        required: false
                        multiple: true
                        collection: competences
                        search_fields: ["title", "aspect"]
                        display_fields: ["{{title}} - {{aspect}}"]
                        value_field: "{{slug}}"
                        filters:
                            - field: aspect
                              values: ["Schlüsselkompetenzen"]
                      - label: Individueller Lebensbezug
                        name: individual_reference
                        widget: list
                        summary: "{{fields.number}}. {{fields.title}}"
                        fields:
                            - { label: Titel, name: title, widget: markdown }
                            - { label: Nummer, name: number, widget: number }
                            - {
                                  label: Lektionen,
                                  name: lessons,
                                  widget: number,
                                  required: false,
                              }
                            - label: Lerninhalte
                              name: learning_contents
                              widget: list
                              summary: "{{fields.number}}. {{fields.titel}}"
                              fields:
                                  - {
                                        label: Titel,
                                        name: titel,
                                        widget: markdown,
                                    }
                                  - {
                                        label: Nummer,
                                        name: number,
                                        widget: number,
                                    }
                                  - label: Gesellschaftliche Aspekte
                                    name: social_aspects
                                    widget: list
                                    required: false
                                    summary: "{{fields.aspect}}"
                                    fields:
                                        - label: Aspekt
                                          name: aspect
                                          widget: relation
                                          collection: competences
                                          search_fields: ["title", "aspect"]
                                          display_fields:
                                              ["{{title}} - {{aspect}}"]
                                          value_field: "{{slug}}"
                                          filters:
                                              - field: aspect
                                                values:
                                                    [
                                                        "Gesellschaftliche Aspekte",
                                                    ]
                                        - label: Konkretisierung
                                          name: specification
                                          widget: text
                                          required: false
                                  - label: Sprache und Kommunikation
                                    name: language_aspects
                                    widget: list
                                    required: false
                                    summary: "{{fields.aspect}}"
                                    fields:
                                        - label: Aspekt
                                          name: aspect
                                          widget: relation
                                          collection: competences
                                          search_fields: ["title", "aspect"]
                                          display_fields:
                                              ["{{title}} - {{aspect}}"]
                                          value_field: "{{slug}}"
                                          filters:
                                              - field: aspect
                                                values:
                                                    [
                                                        "Sprache und Kommunikation",
                                                    ]
                                        - label: Konkretisierung
                                          name: specification
                                          widget: text
                                          required: false
                - {
                      label: Weiter Lektionen,
                      name: additional_lessons,
                      widget: number,
                      required: false,
                  }
    - name: topic_map
      label: Themen-Schullehrplan Übersicht
      files:
          - label: Startseite Themenübersicht
            name: start
            file: content/topic_map/index.json
            fields:
                - { label: Titel, name: title, widget: string }
                - {
                      label: Scroll-Höhe (vh),
                      name: scroll_height_vh,
                      widget: number,
                      default: 480,
                      hint: "Höhe des Scroll-Bereichs in Viewport-Höhen (z. B. 480 = 4.8 Bildschirmhöhen).",
                  }
                - label: Themen
                  name: topics
                  label_singular: Thema
                  widget: list
                  min: 8
                  max: 8
                  summary: "{{fields.number}}. {{fields.label}}"
                  fields:
                      - { label: Nummer, name: number, widget: number }
                      - { label: Label, name: label, widget: string }
                      - {
                            label: Hover-Farbe,
                            name: hover_color,
                            widget: color,
                        }
                - label: Qualifikationsverfahren
                  name: qv
                  widget: object
                  fields:
                      - { label: Label, name: label, widget: string }
                      - label: Annotationen
                        name: annotations
                        label_singular: Annotation
                        widget: list
                        required: false
                        fields:
                            - { label: Text, name: text, widget: string }
                - label: Erklärungs-Bubbles
                  name: bubbles
                  label_singular: Bubble
                  widget: list
                  required: false
                  summary: "{{fields.order}}. {{fields.title}} ({{fields.side}})"
                  fields:
                      - { label: Titel, name: title, widget: string }
                      - { label: Text, name: text, widget: text }
                      - label: Seite
                        name: side
                        widget: select
                        options:
                            - { label: Links, value: left }
                            - { label: Rechts, value: right }
                      - {
                            label: Reihenfolge (Scroll),
                            name: order,
                            widget: number,
                            hint: "Bestimmt die Reihenfolge beim Einblenden beim Scrollen.",
                        }
                      - {
                            label: Anker-Thema,
                            name: anchor_topic,
                            widget: number,
                            min: 1,
                            max: 9,
                            hint: "Vertikale Position: 1–8 = Thema, 9 = QV.",
                        }
    - name: aspects
      label: Aspekte
      label_singular: Aspekt
      folder: content/aspects
      create: false
      extension: json
      format: json
      slug: "{{slug}}"
      sortable_fields: ["title"]
      fields:
          - { label: Titel, name: title, widget: string }
          - { label: Beschreibung, name: description, widget: markdown }
          - { label: Farbe, name: color, widget: color }
    - name: competences
      label: Kompetenzen
      label_singular: Kompetenz
      folder: content/competences
      create: true
      extension: json
      format: json
      slug: "{{slug}}"
      sortable_fields: ["title", "aspect"]
      summary: "{{fields.title}} - {{fields.aspect}}"
      fields:
          - { label: Titel, name: title, widget: string }
          - { label: Beschreibung, name: description, widget: markdown }
          - { label: Farbe, name: color, widget: color }
          - label: Aspekt
            name: aspect
            widget: relation
            collection: aspects
            search_fields: ["title"]
            display_fields: ["title"]
            value_field: "title"
